def ink(line, t):

def glass(ry, rx, edge):

    spec = np.clip(1 - np.hypot(ry, rx) * 1.6, 0, 1) ** 3

  }
  if(t>=CYC)fade=Math.max(0,1-(t-CYC)/(DIS*.55));
  const key=cur+':'+typedChars+':'+fade.toFixed(2);if(key===codeKey)return;codeKey=key;
  let h='';
  for(let r=0;r<ROWS;r++){
    const idx=cur-CURROW+r;let show=idx>=0&&idx<SRC.length;
    if(t<BUILD&&(idx<S0||idx>cur))show=false;
    if(!show){h+='<div class="ln"><b></b><span></span></div>';continue}
    let line=SRC[idx];const isCur=idx===cur;
    if(t<BUILD&&isCur)line=line.slice(0,typedChars);
    const op=idx>cur?.42:(.55+.45*(r/CURROW>1?1:r/CURROW));
    h+=`<div class="ln${isCur?' cur':''}" style="opacity:${(op*fade).toFixed(2)}"><b>${L0+idx}</b><span>${hl(line)}${isCur?'<u></u>':''}</span></div>`;
  }
  win.innerHTML=h;
}

/* ================= HUD + loop ================= */
const el={clock:document.getElementById('clock'),hl:document.getElementById('hl'),hp:document.getElementById('hp'),hc:document.getElementById('hc'),run:document.getElementById('run')};
el.hl.textContent=LANGS.length;
let clock=0,last=performance.now(),paused=false,userOff=0,fpsAcc=30,steady=false,texTick=0;
const QS=new URLSearchParams(location.search),FORCE_TH=QS.has('th')?+QS.get('th'):null;if(QS.has('t')){clock=+QS.get('t');paused=true}
const TOTAL_P=WF.length+WB.length,TOTAL_C=WF.reduce((a,w)=>a+w.n,0)+WB.reduce((a,w)=>a+w.n,0);
function counts(t){
  let p=0,c=0;for(const w of WF){if(t>=w.r&&t<CYC+w.d){p++;c+=w.n}}
  for(const w of WB){if(t>=w.r&&t<CYC+w.d){p++;c+=w.n}}return[p,c];
}
function frame(now){
  requestAnimationFrame(frame);
  const el_=now-last;if(el_<31)return;last=now;
  fpsAcc+=(Math.min(60,1000/el_)-fpsAcc)*.1;
  if(!paused)clock+=Math.min(el_,100)/1000;
  if(clock>=CYC+DIS){clock=0;steady=false;codeKey=''}
  const t=clock;
  // texture rebuild only while words appear or vanish
  const live=t<BUILD+.3||t>=CYC;
  if(live||!steady){drawTex(FR,WF,MKc,t);drawTex(BK,WB,MKB,t);steady=!live}
  // spin: ease in while the clover is typed, then constant speed
  const w0=2*Math.PI/TURN,u=Math.min(t,BUILD),th=w0*(.15*u+.85*u*u/(2*BUILD))+(t>BUILD?w0*(t-BUILD):0)+userOff;
  drawClover(FORCE_TH!==null?FORCE_TH:th,t);
  twinkle(t);
  ac.setTransform(DPR,0,0,DPR,0,0);ac.globalCompositeOperation='source-over';ac.globalAlpha=1;ac.fillStyle='#000';ac.fillRect(0,0,AW,AH);
  drawStars();
  const ks=Math.min(AH*.9/TH,AW*.94/TW),dx=AW/2-(40+CX)*ks,dy=(AH-TH*ks)/2-AH*.015;
  ac.imageSmoothingEnabled=true;ac.drawImage(LAY,0,0,LAY.width,LAY.height,dx,dy,(TW+80)*ks,TH*ks);
  // cheap bloom: shrink, then add back softened
  bl.setTransform(1,0,0,1,0,0);bl.clearRect(0,0,BL.width,BL.height);bl.drawImage(art,0,0,BL.width,BL.height);
  ac.setTransform(1,0,0,1,0,0);ac.globalCompositeOperation='lighter';ac.globalAlpha=.6;ac.drawImage(BL,0,0,art.width,art.height);ac.globalAlpha=1;ac.globalCompositeOperation='source-over';
  // hud
  el.clock.textContent='t '+t.toFixed(2).padStart(5,'0')+'s';
  const [p,c]=(t<BUILD+.3||t>=CYC)?counts(t):[TOTAL_P,TOTAL_C];
  el.hp.textContent=p;el.hc.textContent=c.toLocaleString('en-US');
  el.run.textContent=(paused?'paused':'running')+' · '+Math.min(30,Math.round(fpsAcc))+' fps';
  renderCode(t);
}
// drag to spin it by hand; tap to pause
let drag=null;
box.addEventListener('pointerdown',e=>{drag={x:e.clientX,moved:false};try{box.setPointerCapture(e.pointerId)}catch(_){}});
box.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>3)drag.moved=true;userOff+=dx*.012;drag.x=e.clientX});
const end=()=>{if(drag&&!drag.moved)paused=!paused;drag=null};
box.addEventListener('pointerup',end);box.addEventListener('pointercancel',()=>{drag=null});
renderCode(0);requestAnimationFrame(frame);
window.__lucky={langs:LANGS.length,phrases:TOTAL_P,state:()=>({clock,paused,steady})};
})();
</script>
